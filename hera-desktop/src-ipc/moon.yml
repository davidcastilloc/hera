$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
stack: 'backend'
layer: 'library'

dependsOn:
  - 'hera-rs'

tasks:
  check:
    command: 'cargo check -p hera-ipc'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: 'if command -v cargo-nextest >/dev/null 2>&1; then cargo nextest run -p hera-ipc; else cargo test -p hera-ipc; fi'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
      - '/hera-desktop/src-tauri/Cargo.toml'
      - '/hera-desktop/src-tauri/build.rs'
      - '/hera-desktop/src-tauri/src/**/*'
      - '/hera-desktop/src-tauri/capabilities/**/*'
