# https://doc.rust-lang.org/cargo/reference/manifest.html

[package]
name = "hera-desktop"
version.workspace = true
description = "HERA Desktop — Pure-Rust DJ Curation, 4-Hot-Cue DSP, P2P Swarm & AI Copilot"
authors.workspace = true
license.workspace = true
repository.workspace = true
edition = "2024"

[features]
default = []
mcp-bridge = []

[build-dependencies]
tauri-build = { version = "2.6.2", features = ["codegen"] }

[dependencies]
tauri = { version = "2.12.2", features = [
  "protocol-asset",
  "image-png",
  "devtools",
] }
tauri-plugin-mcp-bridge = "0.13.2"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-dialog = "2.7.1"
tauri-plugin-fs = "2.5.1"
tauri-plugin-log = { version = "2.8.0", features = ["colored"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-opener = "2.5.4"
tauri-plugin-os = "2.3.2"
tauri-plugin-prevent-default = "4.0.4"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.5"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-window-state = "2.4.1"

# non-Tauri dependencies
anyhow = "1.0.102"
axum = "0.8.9"
base64 = "0.22.1"
dirs = "6.0.0"
home-config = { version = "0.7.0", features = ["toml"] }
indexmap = "2.14.0"
itertools = "0.14.0"
log = "0.4.30"
lofty = "0.23.3"
m3u = "1.0.0"
memoize = "0.6.0"
nosleep = "0.2.1"
pathdiff = "0.2.3"
rayon = "1.12.0"
serde.workspace = true
serde_json.workspace = true
sqlx = { version = "0.8.6", features = ["sqlite", "runtime-tokio", "macros"] }
strum.workspace = true
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
thiserror.workspace = true
ts-rs.workspace = true
uuid = { version = "1.23.1", features = ["v3", "v4", "fast-rng"] }
walkdir = "2.5.0"
hera-ipc = { path = "../src-ipc" }
hera-node-rs = { path = "../../hera-rs" }
