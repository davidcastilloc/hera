[workspace]
resolver = "2"
members = [
  "hera-rs",
  "hera-desktop/src-ipc",
  "hera-desktop/src-tauri",
]
default-members = [
  "hera-rs",
  "hera-desktop/src-ipc",
]

[workspace.package]
version = "0.6.0"
license = "MIT"
authors = ["David Castillo <vikruzdavid@gmail.com>"]
repository = "https://github.com/davidcastilloc/hera"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.18"
ts-rs = "12.0.1"
strum = { version = "0.28.0", features = ["derive"] }

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
