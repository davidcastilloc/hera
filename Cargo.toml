[workspace]
resolver = "2"
members = [
  "hera-rs",
  "hera-desktop/src-ipc",
  "hera-desktop/src-tauri",
]
default-members = [
  "hera-rs",
  "hera-desktop/src-ipc",
]

[workspace.package]
version = "0.6.0"
license = "MIT"
authors = ["David Castillo <vikruzdavid@gmail.com>"]
repository = "https://github.com/davidcastilloc/hera"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false }
cpal = "0.18.2"
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }
http = "1.3"
insta = { version = "1.43", features = ["json", "redactions"] }
realfft = "3.5.1"
rmcp = { version = "3.9.0", default-features = false }
rtrb = "0.4.1"
rubato = "5.0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.18"
tokio = "1.52.3"
ts-rs = "12.0.1"

[profile.dev]
incremental = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
