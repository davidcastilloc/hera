[project]
name = "hera"
version = "0.1.0"
description = "Herramienta local para descubrir, adquirir, analizar y organizar música"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0.0",
    "aiosqlite>=0.20.0",
    "click>=8.0.0",
    "tomli-w>=1.0.0",
    "httpx>=0.27.0",
    "structlog>=24.0.0",
    "pyyaml>=6.0",
    "mutagen>=1.47.0",
    "google-antigravity>=0.1.14",
    "google-genai>=2.20.0",
    "google-auth>=2.0.0",
    "python-dotenv>=1.0.0",
    "streamlit>=1.35.0",
]



[project.optional-dependencies]
desktop = [
    "pystray>=0.19.0",
    "Pillow>=10.0.0",
]
analysis = [

    "librosa>=0.10.0",
    "pyacoustid>=1.3.0",
    "numpy>=1.26.0",
    "soundfile>=0.12.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
hera = "hera.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hera", "providers", "analyzers"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
