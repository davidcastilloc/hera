name: HERA Desktop Multi-OS Release (Tauri v2 + Bun)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: ''
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout HERA Repository
        uses: actions/checkout@v4

      - name: Install Linux WebKit2GTK & Audio Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev libsoup-3.0-dev

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            hera-rs -> target
            hera-desktop/src-tauri -> target

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install Frontend Dependencies (Bun)
        working-directory: hera-desktop
        run: bun install

      - name: Build & Publish HERA Desktop Native Installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: hera-desktop
          tagName: v__VERSION__
          releaseName: 'HERA v__VERSION__ — Open-Core AI & P2P DJ Engine'
          releaseBody: 'See CHANGELOG.md for full release notes.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
