name: HERA Community CI (Lean PR & Manual Gate)

on:
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "assets/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hera-fast-gate:
    name: Pure Rust DSP, IPC Guardian & Desktop Bundle Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain + wasm32 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Rust Cargo Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Cargo Check, WASM Gate & Headless IPC/ACL/Hygiene Guardian (hera-rs + hera-ipc)
        run: |
          cargo check
          cargo check --manifest-path hera-rs/Cargo.toml --target wasm32-unknown-unknown --features cloudflare --no-default-features
          cargo test -p hera-ipc
          cargo test -p hera-node-rs

      - name: Setup Bun 1.4.4 & Node.js 24
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js 24 runtime for Vite+
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify HERA Desktop Format, Typecheck, Unit Tests & Bundle Build
        working-directory: hera-desktop
        run: |
          bun install --ignore-scripts
          bun run check
          bun run test
          bun run build
