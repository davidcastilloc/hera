name: HERA Community CI (Pure Rust + HERA Desktop ODD Verification)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  odd-and-open-core-hygiene:
    name: ODD Multi-OS Path Audit & Open-Core Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Zero OS Symlinks in .agent/skills and .claude/skills
        run: |
          SYMLINKS=$(find .agent/skills .claude/skills -type l)
          if [ -n "$SYMLINKS" ]; then
            echo "Error: OS symlinks detected in skills directories: $SYMLINKS"
            exit 1
          fi

      - name: Open-Core Security Boundary Check (No Private SaaS Leaks)
        run: |
          if grep -rnE '/api/v1/cloud/economics|/api/v1/dj/upgrade-tier|X-Hera-Admin-Secret|calculate_cloudflare_beta_economics' hera-rs/src/ hera-desktop/src/; then
            echo "Error: Private hera-cloud SaaS routes/economics leaked into public hera repository!"
            exit 1
          fi

  rust-dsp-node:
    name: Rust DSP & P2P Node (hera-rs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cargo Check & Test (hera-rs)
        run: |
          cargo check --manifest-path hera-rs/Cargo.toml
          cargo test --manifest-path hera-rs/Cargo.toml

  hera-desktop-ui:
    name: HERA Desktop UI (React 19 + StyleX + Vite+)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hera-desktop
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable Corepack & Install Dependencies
        run: |
          corepack enable
          pnpm install --ignore-scripts

      - name: Run Vite+ Format, Lint & Typecheck (vp check)
        run: ./node_modules/.bin/vp check

      - name: Run Production Bundle Build (vp build)
        run: ./node_modules/.bin/vp build

      - name: Run Unit Tests (vp test)
        run: ./node_modules/.bin/vp test run --project unit
