name: Release Multi-OS hera-node Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-hera-node:
    name: Build hera-node (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: hera-node
            asset_name: hera-node-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: hera-node
            asset_name: hera-node-macos-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: hera-node.exe
            asset_name: hera-node-windows-x86_64.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Compile hera-node release binary
        run: cargo build --release --manifest-path hera-rs/Cargo.toml --target ${{ matrix.target }}

      - name: Stage release artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "hera-rs/target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.asset_name }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Publish to GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ matrix.asset_name }}
