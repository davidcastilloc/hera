name = "hera-node"
main = "build/worker/shim.mjs"
compatibility_date = "2025-01-01"

[vars]
HERA_NODE_ID = "hera-cf-edge-node"
HERA_BETA_R2_QUOTA_MB = "5120" # 5 GB (5,120 MB) per selected Founding Beta MVP DJ (~130 lossless FLACs)

[build]
command = "cargo install -q worker-build && worker-build --release -- --features cloudflare --no-default-features"

