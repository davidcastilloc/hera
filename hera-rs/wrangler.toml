name = "hera-node"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

[observability]
enabled = true
head_sampling_rate = 1

[observability.traces]
enabled = true
head_sampling_rate = 0.1

[vars]
HERA_NODE_ID = "hera-cf-edge-node"
HERA_BETA_R2_QUOTA_MB = "5120" # 5 GB (5,120 MB) per selected Founding Beta MVP DJ (~130 lossless FLACs)

[build]
command = "cargo install -q worker-build --version 0.1.3 && worker-build --release -- --features cloudflare --no-default-features"

[[d1_databases]]
binding = "HERA_DB"
database_name = "hera-p2p-catalog"
database_id = "fa584f5e-e59d-417a-aef6-23053b849c69"

[[r2_buckets]]
binding = "HERA_LIBRARY_BUCKET"
bucket_name = "hera-verified-masters"

[[kv_namespaces]]
binding = "HERA_KV_CACHE"
id = "5a943afd2f7b4476bd79652da0a5679a"

[[vectorize]]
binding = "HERA_VECTOR_INDEX"
index_name = "hera-64d-style-embeddings"

[ai]
binding = "AI"
