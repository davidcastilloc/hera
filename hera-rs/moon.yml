$schema: 'https://moonrepo.dev/schemas/project.json'

language: 'rust'
stack: 'backend'
layer: 'library'

tasks:
  check:
    command: 'cargo check -p hera-node-rs'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  test:
    command: 'if command -v cargo-nextest >/dev/null 2>&1; then cargo nextest run -p hera-node-rs; else cargo test -p hera-node-rs; fi'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'

  build:
    command: 'cargo build --release -p hera-node-rs'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - '/Cargo.toml'
      - '/Cargo.lock'
    outputs:
      - '/target/release/hera-node'
